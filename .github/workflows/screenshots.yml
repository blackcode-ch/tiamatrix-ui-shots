name: Composer screenshots
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.65.0
      - run: npx playwright install --with-deps chromium
      - run: node render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-screenshots
          path: shots/
          retention-days: 7

