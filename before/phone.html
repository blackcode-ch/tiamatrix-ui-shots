<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone composer</title><style>*{box-sizing:border-box}
body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{--bg:#f7f6f2;--panel:#fffefa;--text:#262b26;--muted:#767a70;--line:#e5e5dd;--accent:#356348;--soft:#e7eddf;--amber:#8a5527;--warm:#f3e9cf;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit}
button{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button{color:inherit}
.page-head{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:66px;background:var(--bg);position:sticky;top:0;z-index:2}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;flex:none;border-radius:12px}
.page-head .portrait{width:35px;height:35px}
.compose{display:flex;align-items:center;gap:5px;padding:10px 14px;flex:none;border-top:1px solid var(--line);background:var(--panel)}
.compose input{min-width:0;flex:1;background:transparent;border:0;height:44px;font-size:16px;color:var(--text);outline-offset:0}
.compose input::placeholder{font-size:14px;color:var(--muted)}
.send{background:var(--accent);color:var(--accent-text,var(--panel));border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.compose textarea{font:16px/1.45 inherit;font-family:inherit;font-size:16px;flex:1;min-width:0;min-height:44px;max-height:130px;resize:none;border:0;background:transparent;padding:10px 4px;color:var(--text)}
.page-head{position:sticky;top:0}
@media(min-width:481px){body{background:#e7e8e1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
.compose textarea{line-height:1.45}
.compose{flex-wrap:wrap}
.compose .send{order:3}
.compose textarea{order:2}
.photo-pick{order:1;flex:none;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center}
.photo-pick svg{width:23px;height:23px}
.compose{position:relative}
.compose .voice-wrap{order:3}
.compose .send{order:4}
.voice-wrap{position:relative;display:inline-grid;flex:none;place-items:center}
.voice-mic{width:56px;height:56px;min-width:56px;border-radius:50%;display:grid;place-items:center;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.voice-mic[data-rec="true"]{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important;animation:voice-pulse 1.2s ease-in-out infinite}
.voice-mic[data-busy="true"]{opacity:.6}
.voice-mic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
@media(prefers-reduced-motion:reduce){.voice-mic[data-rec="true"]{animation:none}}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}.page-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.space{flex:1}</style><header class="page-head"><strong>Conversation</strong><span>&#8943;</span></header><div class="space"></div><form id="composer" class="compose"><textarea id="message" rows="1" placeholder="Write a message..."></textarea><button class="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m4 12 15-8-5 16-3-6zM11 14l8-10"/></svg></button><span class="voice-wrap"><button class="voice-pick voice-mic" aria-label="Microphone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button class="voice-talk" style="min-height:44px;padding:6px 12px;border-radius:12px;margin:4px">Start conversation</button></span><button class="photo-pick" aria-label="Attach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m8 13 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9a3 3 0 0 1 5 5l-9 9"/></svg></button><button id="chat-speech" style="flex:0 0 100%;min-height:44px;white-space:normal" aria-pressed="false">Read spoken replies aloud &middot; Off</button></form></html>
