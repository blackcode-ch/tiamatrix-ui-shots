<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone composer</title><style>*{box-sizing:border-box}
body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{--bg:#f7f6f2;--panel:#fffefa;--text:#262b26;--muted:#767a70;--line:#e5e5dd;--accent:#356348;--soft:#e7eddf;--amber:#8a5527;--warm:#f3e9cf;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit}
button{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button{color:inherit}
.page-head{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:66px;background:var(--bg);position:sticky;top:0;z-index:2}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;flex:none;border-radius:12px}
.page-head .portrait{width:35px;height:35px}
.compose{display:flex;align-items:center;gap:5px;padding:10px 14px;flex:none;border-top:1px solid var(--line);background:var(--panel)}
.compose input{min-width:0;flex:1;background:transparent;border:0;height:44px;font-size:16px;color:var(--text);outline-offset:0}
.compose input::placeholder{font-size:14px;color:var(--muted)}
.send{background:var(--accent);color:var(--accent-text,var(--panel));border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.compose textarea{font:16px/1.45 inherit;font-family:inherit;font-size:16px;flex:1;min-width:0;min-height:44px;max-height:130px;resize:none;border:0;background:transparent;padding:10px 4px;color:var(--text)}
.page-head{position:sticky;top:0}
@media(min-width:481px){body{background:#e7e8e1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
.compose textarea{line-height:1.45}
#composer.compose{ flex-wrap:wrap; align-items:center; gap:4px; padding:8px 10px; }
#composer.compose textarea{ order:2; flex:1 1 0; min-width:0; width:0; min-height:44px; height:44px; padding:10px 0; }
#composer.compose .photo-pick{ order:1; flex:0 0 36px; height:44px; width:36px; margin:0; }
#composer.compose .voice-wrap{ order:3; height:44px; width:40px; flex:0 0 40px; }
#composer.compose .voice-mic{ height:44px; min-height:44px; width:40px; min-width:40px; padding:0; }
#composer.compose .voice-talk-menu{ order:4; flex:0 0 20px; position:relative; }
.voice-talk-menu summary{ display:grid; place-items:center; list-style:none; height:44px; cursor:pointer; }
.voice-talk-menu summary::-webkit-details-marker,.chat-options summary::-webkit-details-marker{ display:none; }
.voice-talk-menu .voice-talk{ position:absolute; right:0; bottom:calc(100% + 8px); z-index:10; background:var(--panel); color:var(--text); border:1px solid var(--line); box-shadow:0 4px 16px #0002; }
#composer.compose .send{ order:5; flex:0 0 40px; height:44px; min-height:44px; width:40px; margin:0; }
.chat-options{ position:relative; flex:none; }
.chat-options summary{ list-style:none; cursor:pointer; }
.chat-options-panel{ position:absolute; right:0; top:100%; width:240px; max-width:calc(100vw - 24px); padding:8px; z-index:20; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 4px 16px #0002; }
.chat-options-panel button,.chat-options-panel a{ display:block; width:100%; min-height:44px; padding:8px; text-align:left; white-space:normal; color:var(--text); background:transparent; border:0; font:inherit; }
.compose{flex-wrap:wrap}
.compose .send{order:3}
.compose textarea{order:2}
.photo-pick{order:1;flex:none;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center}
.photo-pick svg{width:23px;height:23px}
.compose{position:relative}
.compose .voice-wrap{order:3}
.compose .send{order:4}
.voice-wrap{position:relative;display:inline-grid;flex:none;place-items:center}
.voice-mic{width:56px;height:56px;min-width:56px;border-radius:50%;display:grid;place-items:center;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.voice-mic[data-rec="true"]{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important;animation:voice-pulse 1.2s ease-in-out infinite}
.voice-mic[data-busy="true"]{opacity:.6}
.voice-mic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
@media(prefers-reduced-motion:reduce){.voice-mic[data-rec="true"]{animation:none}}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}.page-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.space{flex:1}</style><header class="page-head"><strong>Conversation</strong><details class="chat-options"><summary class="icon-btn" aria-label="Conversation menu">&#8943;</summary><div class="chat-options-panel"><button id="chat-speech" aria-pressed="false">Read spoken replies aloud &middot; Off</button><a>Advanced</a></div></details></header><div class="space"></div><form id="composer" class="compose"><textarea id="message" rows="1" placeholder="Write a message..."></textarea><button class="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m4 12 15-8-5 16-3-6zM11 14l8-10"/></svg></button><span class="voice-wrap"><button class="voice-pick voice-mic" aria-label="Microphone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></span><details class="voice-talk-menu"><summary aria-label="Conversation controls">&#9662;</summary><button class="voice-talk" style="height:44px;min-height:44px;padding:0 10px;border-radius:8px;margin:0;white-space:nowrap">Start conversation</button></details><button class="photo-pick" aria-label="Attach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m8 13 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9a3 3 0 0 1 5 5l-9 9"/></svg></button></form></html>
